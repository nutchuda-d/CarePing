# Mosquitto settings for CarePing — local development only.
# Run from the CarePing folder:   mosquitto -v -c mosquitto.conf
#
# Listen on every network card, so Node-RED inside Docker can connect
# (Mosquitto 2.x only listens on localhost by default).
listener 1883

# No username/password while developing on your own computer.
# Turn this off and add a password file before using real patient buttons.
allow_anonymous true
